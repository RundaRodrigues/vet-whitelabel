name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Dois jobs, e não um, de propósito. Com upload e deploy no mesmo job,
# o deploy às vezes consulta a API antes de o artefato recém-enviado
# ficar visível e falha com "No artifacts found". Separando, o artefato
# já está consolidado quando o job de deploy começa.
#
# Não use "Re-run failed jobs" num run que falhou: isso sobe um segundo
# artefato com o mesmo nome e o deploy passa a recusar por duplicidade.
# Dispare um run novo pelo botão "Run workflow".

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Site estático puro: publica a raiz do repo sem build.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
